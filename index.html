<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally Board</title>
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: sticky masthead with Score / Ranking tabs, one list of bar rows, a fixed scoring dock at the bottom (Score tab only). Scoreboard amber on graphite. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E1E6EC; --fg:#141A21; --muted:#59636F; --line:#D2D9E1;
  --accent:#D9480F; --accent-ink:#B23A08; --on-accent:#FFFFFF; --bar:#AEBAC7; --neg:#C0392B; --on-neg:#FFFFFF; --note:#FBE6DA; --pl:36%; --pc-ink:#FFFFFF;
  --font-display:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#171D25; --surface-2:#232C37; --fg:#ECF0F4; --muted:#9AA5B1; --line:#2C3642;
    --accent:#FF8A3D; --accent-ink:#FF9E5E; --on-accent:#1B1108; --bar:#46546A; --neg:#FF7A6B; --on-neg:#26090A; --note:#2A1C12; --pl:62%; --pc-ink:#10151B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171D25; --surface-2:#232C37; --fg:#ECF0F4; --muted:#9AA5B1; --line:#2C3642;
  --accent:#FF8A3D; --accent-ink:#FF9E5E; --on-accent:#1B1108; --bar:#46546A; --neg:#FF7A6B; --on-neg:#26090A; --note:#2A1C12; --pl:62%; --pc-ink:#10151B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  min-height:100vh; padding-top:env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:10}
button{font:inherit; color:inherit; touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.masthead{position:sticky; top:env(safe-area-inset-top, 0px); z-index:9; background:var(--bg); padding-block:14px 10px; display:grid; gap:12px}
.mast-row{display:flex; align-items:center; gap:12px}
.mast-title{flex:1; min-width:0}
h1{margin:0; font:700 26px/1.1 var(--font-display); letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sub{margin:2px 0 0; font-size:13px; color:var(--muted)}
.icon-btn{width:44px; height:44px; border-radius:12px; border:0; background:var(--surface); color:var(--fg); display:grid; place-items:center; cursor:pointer}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--surface-2); border-radius:12px}
.tabs button{height:38px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--fg)}

main{padding-bottom:calc(var(--dock-h, 190px) + 24px)}
body[data-tab="rank"] main{padding-bottom:calc(32px + env(safe-area-inset-bottom, 0px))}

.rows{display:grid; gap:8px}
.row{
  appearance:none; width:100%; text-align:left; --pc:hsl(var(--h,200) 68% var(--pl)); background:var(--surface); border:1.5px solid transparent; border-radius:12px;
  padding:10px 12px; display:grid; grid-template-columns:22px 32px minmax(0,1fr) auto; column-gap:10px; align-items:center;
}
button.row{cursor:pointer}
.row.sel{border-color:var(--accent)}
.rank{font:700 15px var(--font-display); color:var(--muted); text-align:center; font-variant-numeric:tabular-nums}
.body{min-width:0; display:block}
.name{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta{display:block; font-size:12px; color:var(--muted)}
.score{font:700 26px/1 var(--font-display); font-variant-numeric:tabular-nums; text-align:right}
.score.negv{color:var(--neg)}
.lead .rank, .lead .score:not(.negv){color:var(--accent-ink)}
.track{position:relative; display:block; height:10px; margin-top:7px; border-radius:5px; background:var(--surface-2); overflow:hidden}
.fill{position:absolute; top:0; bottom:0; border-radius:5px; background:var(--pc, var(--bar)); transition:left .6s cubic-bezier(.34,1.25,.64,1), width .6s cubic-bezier(.34,1.25,.64,1)}
.fill.neg{opacity:.65}
.zero{position:absolute; top:0; bottom:0; width:2px; background:var(--fg); opacity:.35}
.big .track{height:22px; border-radius:7px}
.big .fill{border-radius:7px}
.big .row{padding:12px}

.note{display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:10px; padding:10px 12px; border-radius:10px; background:var(--note); font-size:13px}
.empty{padding:18px 4px; color:var(--muted)}

.add{display:flex; gap:8px; margin-top:12px}
body[data-tab="rank"] .add, body[data-tab="rank"] #addMsg{display:none}
input[type="text"], input[type="number"]{
  flex:1; min-width:0; height:46px; padding:0 12px; font:inherit; font-size:16px; color:var(--fg);
  background:var(--surface); border:1.5px solid var(--line); border-radius:10px; -webkit-appearance:none; appearance:none;
}
input::placeholder{color:var(--muted)}
.btn{height:46px; padding:0 16px; border:0; border-radius:10px; background:var(--accent); color:var(--on-accent); font-weight:600; cursor:pointer; white-space:nowrap}
.btn.ghost{background:var(--surface-2); color:var(--fg)}
.btn.danger{background:var(--neg); color:var(--on-neg)}
.btn.sm{height:38px; padding:0 12px; font-size:14px}
.btn:disabled{opacity:.4; cursor:default}

.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:8; background:var(--surface); border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
body[data-tab="rank"] .dock{display:none}
.dock-head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.dock-who{flex:1; min-width:0}
.dock-who b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dock-score{font:700 22px/1 var(--font-display); font-variant-numeric:tabular-nums; padding-right:4px}
.chips{display:grid; grid-template-columns:repeat(auto-fit, minmax(62px, 1fr)); gap:8px}
.chip{height:52px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font:700 20px var(--font-display); font-variant-numeric:tabular-nums; cursor:pointer}
.chip.plus{color:var(--accent-ink); border-color:var(--accent)}
.chip.minus{color:var(--neg)}
.chip:active:not(:disabled){transform:scale(.96)}
.chip:disabled{opacity:.4; cursor:default}

.overlay{position:fixed; inset:0; z-index:20; background:rgba(8,12,17,.55); display:flex; align-items:flex-end}
.sheet{
  width:100%; max-height:90vh; max-height:90dvh; overflow:auto; background:var(--surface); border-radius:18px 18px 0 0; display:grid; gap:16px;
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet h2{margin:0; font:700 20px var(--font-display)}
.field{display:grid; gap:6px}
.field > span, .label{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.field input{width:100%; flex:none}
.inc-list{display:flex; flex-wrap:wrap; gap:8px}
.inc{display:inline-flex; align-items:center; gap:2px; padding:2px 2px 2px 12px; border-radius:999px; background:var(--surface-2); font:700 16px var(--font-display)}
.inc button{width:32px; height:32px; border:0; border-radius:50%; background:transparent; color:var(--muted); font-size:18px; cursor:pointer}
.inline{display:flex; gap:8px}
.msg{margin:0; min-height:1.2em; font-size:13px; color:var(--muted)}
.stack{display:grid; gap:8px}
.foot{font-size:13px; color:var(--muted); margin:0}

.score-cell{text-align:right; min-width:72px}
.score-cell .score{display:block}
.pend{display:block; margin-top:3px; font:700 13px var(--font-display); font-variant-numeric:tabular-nums; color:var(--accent-ink); text-align:right}
.pend.negp{color:var(--neg)}
.dock-score .pend{margin-top:2px}
.round-bar{display:grid; grid-template-columns:auto 1fr; gap:8px; margin-top:10px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--surface-2); border-radius:12px}
.seg button{height:42px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface); color:var(--fg)}
.seg.three{grid-template-columns:1fr 1fr 1fr}

.av{position:relative; width:32px; height:32px; border-radius:50%; background:var(--pc); color:var(--pc-ink); display:grid; place-items:center; font:700 15px var(--font-display)}
.crown{position:absolute; top:-9px; left:50%; width:18px; height:14px; margin-left:-9px; transform:rotate(-8deg); color:#F2B705; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}

.podium{display:grid; gap:8px; align-items:end; padding:14px 0 6px}
.pod{--pc:hsl(var(--h,200) 68% var(--pl)); display:grid; justify-items:center; gap:4px; min-width:0}
.pod .av{width:46px; height:46px; font-size:20px; margin-bottom:2px}
.pod .crown{width:26px; height:20px; top:-16px; margin-left:-13px}
.pod-name{max-width:100%; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pod-score{font:700 20px/1 var(--font-display); font-variant-numeric:tabular-nums}
.pod-score.negv{color:var(--neg)}
.pod-block{width:100%; border-radius:10px 10px 4px 4px; background:var(--pc); color:var(--pc-ink); display:grid; place-items:center; font:700 24px var(--font-display); transform-origin:bottom; animation:rise .7s cubic-bezier(.34,1.3,.64,1) both}
@keyframes rise{from{transform:scaleY(.15); opacity:.3}}

.pend.pop{transform-origin:right center; animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.5)}}

.inrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center}
.btn.tall{height:60px; min-width:96px; padding:0 14px}
.dial-wrap{position:relative; min-width:0; height:60px}
.dial{display:flex; height:60px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-x:contain; touch-action:pan-x; background:var(--bg); border:1.5px solid var(--line); border-radius:12px}
.dial::-webkit-scrollbar{display:none}
.dial-pad{flex:none; width:calc(50% - 26px)}
.tick{flex:none; width:52px; scroll-snap-align:center; display:grid; align-content:end; justify-items:center; gap:5px; padding-bottom:7px; font:700 15px var(--font-display); font-variant-numeric:tabular-nums; color:var(--muted); transition:color .15s}
.tick::before{content:""; width:2px; height:11px; border-radius:1px; background:var(--line)}
.tick.mj::before{height:19px; background:var(--muted)}
.tick.on{color:var(--fg)}
.dial-mark{position:absolute; top:5px; bottom:5px; left:50%; width:3px; margin-left:-1.5px; border-radius:2px; background:var(--accent); pointer-events:none}
.dial-fade{position:absolute; inset:0; border-radius:12px; pointer-events:none; background:linear-gradient(90deg, var(--bg), transparent 28%, transparent 72%, var(--bg))}
.wheel-box{display:flex; align-items:center; justify-content:center; gap:16px}
.dock.lefty .wheel-box{flex-direction:row-reverse}
.dock.lefty .round-bar{flex-direction:row-reverse}
.wheel-side{flex:1 1 0; min-width:0; display:grid; gap:8px; justify-items:start}
.turn-in{width:92px; height:40px; padding:0 8px; font:inherit; font-weight:600; text-align:center; color:var(--fg); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; -webkit-appearance:none; appearance:none; -webkit-appearance:none; appearance:none}
.turn-line{display:flex; align-items:center; gap:8px}
.wheel{position:relative; width:168px; height:168px; flex:none; border-radius:50%; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab}
.wheel:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.wheel-rot{position:absolute; inset:0; border-radius:50%; will-change:transform;
  background:repeating-conic-gradient(var(--muted) 0 1.2deg, transparent 1.2deg 15deg);
  -webkit-mask-image:radial-gradient(circle closest-side, transparent 0 78%, #000 79%); mask-image:radial-gradient(circle closest-side, transparent 0 78%, #000 79%)}
.wheel-dot{position:absolute; left:50%; top:7px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.35)}
.wheel.neg .wheel-dot{background:var(--neg)}
.wheel.off{opacity:.55; cursor:default}
.wheel-hub{pointer-events:none; position:absolute; left:50%; top:50%; width:88px; height:88px; margin:-44px 0 0 -44px; border-radius:50%; border:0; background:var(--surface); color:var(--fg); box-shadow:0 1px 6px rgba(0,0,0,.25); display:grid; place-content:center; gap:0; font:inherit}
.wheel-hub b{font-family:var(--font-display); font-size:22px; line-height:1.1; font-variant-numeric:tabular-nums}
.wheel-hub span{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-ink)}
.wheel.neg .wheel-hub span{color:var(--neg)}
.scale-row{display:flex; align-items:center; gap:6px; margin-bottom:8px}
.scale-row .meta{flex:none}
.scale-row .range{margin-left:auto}
.sc{height:30px; min-width:44px; padding:0 10px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); color:var(--muted); font:700 13px var(--font-display); font-variant-numeric:tabular-nums; cursor:pointer}
.sc[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}

.mini{width:44px; border:0; border-radius:10px; background:var(--surface-2); color:var(--fg); font-size:20px; cursor:pointer}
.mini.armed{width:auto; padding:0 12px; font-size:13px; font-weight:600; background:var(--neg); color:var(--on-neg)}
.game-row{display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:8px; align-items:stretch}
.game-main{appearance:none; -webkit-appearance:none; text-align:left; min-width:0; display:grid; gap:2px; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg); cursor:pointer}
.game-row.cur .game-main{border-color:var(--accent)}
.g-name{display:flex; align-items:center; gap:8px; min-width:0; font-weight:600}
.g-tag{flex:none; padding:1px 8px; border-radius:999px; background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.g-meta{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* Circular table */
.table{position:relative; width:min(100%, 380px, max(300px, calc(100svh - var(--dock-h, 190px) - 200px))); aspect-ratio:1; margin:22px auto 0}
.table-ring{position:absolute; border-radius:50%; border:1.5px dashed var(--line); pointer-events:none}
.table-mid{position:absolute; left:50%; top:50%; width:44%; transform:translate(-50%,-50%); text-align:center; display:grid; gap:2px; justify-items:center; pointer-events:none}
.table-mid .t-name{font-weight:600; font-size:15px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.table-mid .t-score{font:700 38px/1 var(--font-display); font-variant-numeric:tabular-nums}
.table-mid .t-score.negv{color:var(--neg)}
.table-mid .t-hint{font-size:12px; color:var(--muted)}
.table-mid .pend{margin-top:0; text-align:center}
.seat{appearance:none; -webkit-appearance:none; position:absolute; transform:translate(-50%,-50%); --pc:hsl(var(--h,200) 68% var(--pl)); background:transparent; border:0; padding:0; margin:0; font:inherit; color:var(--fg); display:grid; justify-items:center; gap:1px; cursor:pointer; min-width:0}
.seat .av{width:var(--s); height:var(--s); font-size:calc(var(--s) * .42); transition:box-shadow .15s}
.seat.sel .av{box-shadow:0 0 0 3px var(--bg), 0 0 0 5.5px var(--accent)}
.seat-name{font-size:11px; max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); line-height:1.1}
.seat-score{font:700 12px/1.1 var(--font-display); font-variant-numeric:tabular-nums}
.seat-score.negv{color:var(--neg)}
.seat.sm .seat-score{font-size:10.5px}
.seat.dense .seat-score{position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); padding:0 4px; border-radius:8px; background:var(--surface); box-shadow:0 0 0 1px var(--line); font-size:10px}
.seat-pend{position:absolute; top:-6px; left:calc(50% + var(--s) * .3); padding:1px 5px; border-radius:999px; background:var(--accent); color:var(--on-accent); font:700 10px/1.3 var(--font-display); white-space:nowrap}
.seat-pend.negp{background:var(--neg); color:var(--on-neg)}
.seat-pend.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.seat .crown{top:-8px; width:15px; height:11px; margin-left:-7px}

/* Round chart */
.chart-card{background:var(--surface); border-radius:12px; padding:12px 12px 10px; margin-top:6px}
.chart-card h3{margin:0 0 2px; font:700 16px var(--font-display)}
.chart-card .sub{margin:0 0 6px; font-size:12px; color:var(--muted)}
.chart-wrap{position:relative}
.chart-wrap svg{display:block; width:100%; height:auto; touch-action:pan-y; user-select:none; -webkit-user-select:none}
.chart-tip{position:absolute; top:4px; z-index:2; min-width:120px; max-width:190px; padding:8px 10px; border-radius:10px; background:var(--fg); color:var(--bg); font-size:12px; line-height:1.35; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chart-tip b{display:block; margin-bottom:3px}
.chart-tip .tr{display:flex; align-items:center; gap:6px}
.chart-tip .tr i{flex:none; width:9px; height:9px; border-radius:50%; background:var(--pc)}
.chart-tip .tr span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chart-tip .tr em{margin-left:auto; padding-left:6px; font-style:normal; font-weight:700; font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.lg{appearance:none; -webkit-appearance:none; --pc:hsl(var(--h,200) 68% var(--pl)); display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 8px; border:1.5px solid var(--line); border-radius:999px; background:var(--bg); color:var(--fg); font:inherit; font-size:12px; cursor:pointer}
.lg i{width:9px; height:9px; border-radius:50%; background:var(--pc)}
.lg[aria-pressed="true"]{border-color:var(--accent)}
.chart-tools{display:flex; gap:8px; margin-top:8px}
.tbl-wrap{margin-top:8px; overflow-x:auto}
.tbl{border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; width:100%}
.tbl th, .tbl td{padding:4px 8px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl th:first-child, .tbl td:first-child{text-align:left; position:sticky; left:0; background:var(--surface)}

/* Features */
.strip{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:8px 12px; background:var(--surface); border-radius:12px; margin:8px 0 0}
.st-main{display:grid; min-width:0; flex:1 1 140px}
.st-k{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.st-main b{font:700 17px var(--font-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill{appearance:none; -webkit-appearance:none; border:0; border-radius:999px; background:var(--surface-2); color:var(--fg); font:inherit; font-size:13px; font-weight:600; padding:6px 12px; min-height:34px; cursor:pointer}
.st-timer{display:flex; align-items:center; gap:6px}
.t-time{font:700 18px var(--font-display); font-variant-numeric:tabular-nums; min-width:46px}
.t-time.over{color:var(--neg)}
.st-target{font-size:13px; font-weight:600; color:var(--muted)}
.seat-dealer{position:absolute; left:calc(50% - var(--s) * .62); top:calc(var(--s) - 14px); width:16px; height:16px; border-radius:50%; background:var(--fg); color:var(--bg); font:700 9px/16px var(--font-display); text-align:center; box-shadow:0 0 0 2px var(--bg)}
.sw{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line)}
.sw > span{flex:1; display:grid; gap:2px; min-width:0}
.sw small{color:var(--muted); font-size:12.5px; line-height:1.3}
.sw input{appearance:none; -webkit-appearance:none; flex:none; width:50px; height:30px; margin:0; border-radius:999px; background:var(--surface-2); position:relative; cursor:pointer; transition:background .15s}
.sw input::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(20px)}
.sub-cfg{display:grid; gap:6px; padding:8px 0 10px; border-bottom:1px solid var(--line)}
.ta{width:100%; min-height:96px; padding:10px; font:inherit; color:var(--fg); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; -webkit-appearance:none; appearance:none; resize:vertical}
.preset{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.roster-row{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0}
.rank-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.rank-actions .btn{flex:1 1 140px}
.fin-win{display:grid; gap:6px; justify-items:center; text-align:center; padding:4px 0}
.fin-win h2{margin:0}
.fin-win .av{width:64px; height:64px; font-size:28px}
.stand{display:grid}
.stand-row{--pc:hsl(var(--h,200) 68% var(--pl)); display:grid; grid-template-columns:22px 28px minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line)}
.stand-row .av{width:28px; height:28px; font-size:13px}
.stand-row b{font-variant-numeric:tabular-nums}
.hl{padding:10px 12px; border-radius:10px; background:var(--surface-2); font-size:14px}
.hl em{display:block; font-style:normal; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.share-img{width:100%; border-radius:12px; display:block}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.toast{position:fixed; left:50%; bottom:calc(var(--dock-h, 190px) + 14px); transform:translate(-50%, 12px); z-index:25; max-width:calc(100% - 32px); padding:10px 16px; border-radius:999px; background:var(--fg); color:var(--bg); font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s}
.toast.show{opacity:1; transform:translate(-50%, 0)}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

<body>

<header class="masthead">
  <div class="mast-row">
    <div class="mast-title">
      <h1 id="title">Tally Board</h1>
      <p class="sub" id="count"></p>
    </div>
    <button class="icon-btn" id="btnGames" type="button" aria-label="Games">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabScore" type="button" aria-selected="true">Score</button>
    <button role="tab" id="tabRank" type="button" aria-selected="false">Ranking</button>
  </div>
</header>

<main>
  <div id="note"></div>
  <div class="rows" id="rows"></div>
  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="addIn" maxlength="200" placeholder="Add players, separated by commas" aria-label="Add players">
    <button class="btn" id="addBtn" type="submit">Add</button>
  </form>
  <div class="roster-row" id="rosterRow"></div>
  <p class="msg" id="addMsg" aria-live="polite"></p>
</main>

<section class="dock" id="dock" aria-label="Scoring"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="overlay" id="overlay" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></section>
</div>

<script>

  function sv(tag, attrs){

  /* Saving files: the Claude viewer needs its downloads capability; elsewhere a normal download works */
  async function saveFile(name, blob){
    try {
      if (window.claude && window.claude.use){
        var d = await window.claude.use("downloads");
        if (d){ await d.save({filename: name, data: blob}); return "saved"; }
      }
    } catch (e) { return e && e.code === "declined" ? "declined" : "failed"; }
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      return "saved";
    } catch (e) { return "failed"; }
  }

  function exportText(){
    flush();

  }
  function importText(text){
    var o; try { o = JSON.parse(text); } catch (e) { return "That is not a valid backup."; }
    if (!o || typeof o !== "object" || !o.games || typeof o.games !== "object") return "That is not a Tally Board backup.";
    var added = 0, updated = 0;
    Object.keys(o.games).forEach(function(id){
      var g = normalize(o.games[id]); if (!g) return;
      id = String(id).slice(0, 40).replace(/[^A-Za-z0-9_\-.~:@+]/g, "");
      if (!id) return;
      if (lib.games[id]){ if ((g.updated || 0) > (lib.games[id].updated || 0)){ lib.games[id] = g; updated++; persistGame(id); } return; }
      if (Object.keys(lib.games).length >= MAX_GAMES) return;
      lib.games[id] = g; added++; persistGame(id);
    });
    var rs = normRoster(o.roster);
    Object.keys(rs).forEach(function(k){ var cur = lib.roster[k]; if (!cur || rs[k].games > cur.games) lib.roster[k] = rs[k]; });
    rosterPrune(); persistRoster();
    return "Imported " + added + (added === 1 ? " game" : " games") + (updated ? " and updated " + updated : "") + ".";
  }

    openSheet("Edit " + p.name, [
      h("h2", {}, "Edit player"),
      h("label", {class: "field", for: "fName"}, h("span", {}, "Name"), nameIn),
      h("label", {class: "field", for: "fScore"}, h("span", {}, "Set score"), scoreIn),
      state.feat.dealer ? h("button", {class: "btn ghost", type: "button", onclick: function(){ state.dealerId = id; save(); onSheetClose = null; closeSheet(); }}, "Make dealer") : null,
      confirmBtn("Remove player", "Tap again to remove", function(){
        pushUndo(); state.players = state.players.filter(function(x){ return x.id !== id; });
        selectedId = null; onSheetClose = null; save(); closeSheet();
      }),
      h("button", {class: "btn", type: "button", onclick: closeSheet}, "Done")
    ], apply);
  }

  if (typeof ResizeObserver !== "undefined"){
    new ResizeObserver(function(){ document.documentElement.style.setProperty("--dock-h", dock.offsetHeight + "px"); }).observe(dock);
  }

  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var t = setTimeout(function(){ reject(new Error("timeout")); }, ms);
      promise.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
    });
  }

  function localLoad(){
    try {
      var raw = localStorage.getItem(LIB_KEY);
      if (raw){
        var o = JSON.parse(raw), out = {cur: o && o.cur, games: {}, roster: normRoster(o && o.roster)};
        if (o && o.games) Object.keys(o.games).forEach(function(id){ var g = normalize(o.games[id]); if (g) out.games[id] = g; });
        return out;
      }
      var old = localStorage.getItem(LS_KEY);
      if (old){
        var g1 = normalize(JSON.parse(old));
        if (g1){ var id1 = uid(), games = {}; g1.updated = Date.now(); games[id1] = g1; return {cur: id1, games: games, roster: {}}; }
      }
    } catch (e) {}
    return null;
  }

  async function init(){
    document.body.classList.add("loading");
    render();
    var legacy = null, curId = null, fresh = null;
    try {
      if (window.claude && window.claude.use){
        var parts = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        var db = parts[0], user = parts[1], uidv = user ? await user.id() : null;
        if (db && uidv){
          var col = db.collection("data/users/" + uidv);
          var qs = await withTimeout(col.get(), 8000);
          qs.docs.forEach(function(d){
            var k = d.id, v = d.data();
            if (!v) return;
            if (k.slice(0, 2) === "g-"){ var g = normalize(v); if (g) lib.games[k.slice(2)] = g; }
            else if (k === "cur") curId = v.id;
            else if (k === "roster") lib.roster = normRoster(v.people);
            else if (k === "tally") legacy = v;
          });
          docs = col; storeMode = "account";
        }
      }
    } catch (e) { docs = null; lib.games = {}; lib.roster = {}; legacy = null; curId = null; }
    if (!docs){
      storeMode = "device";
      var loc = localLoad();
      if (loc){ lib.games = loc.games; lib.roster = loc.roster || {}; curId = loc.cur; }
    } else if (!Object.keys(lib.games).length && legacy){
      var lg = normalize(legacy);
      if (lg){ fresh = uid(); lg.updated = Date.now(); lib.games[fresh] = lg; curId = fresh; }
    }
    var ids = gameIds();
    if (!ids.length){
      fresh = uid();
      var sg = normalize(sampleState()); sg.updated = Date.now();
      lib.games[fresh] = sg; curId = fresh; ids = [fresh];
    }
    if (!curId || !lib.games[curId]) curId = ids[0];
    lib.cur = curId;
    state = normalize(lib.games[curId]) || normalize(sampleState());
    selectedId = null;
    hydrated = true;
    if (fresh){ persistGame(fresh); persistCur(); } else if (!docs){ localWrite(); }
    document.body.classList.remove("loading");
    render();
  }
  init();
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
