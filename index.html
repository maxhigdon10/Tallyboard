/* Layout: sticky masthead, one list of bar rows, a fixed scoring dock at the bottom (Score tab only). Scoreboard amber on graphite. */
:root{
  --bg:#FFF3DD; --surface:#FFFFFF; --surface-2:#FFE6BD; --fg:#2B2350; --muted:#675F88; --line:#F1D8A8;
  --accent:#D6420A; --accent-ink:#B23506; --on-accent:#FFFFFF; --bar:#B9ACE0; --neg:#C8283F; --on-neg:#FFFFFF; --note:#FFE29A; --pl:38%; --pc-ink:#FFFFFF;
  --edge:#E6C384; --accent-deep:#8F2D04; --dot:#F6DEB2; --gold:#FFF0C2; --gold-line:#F0C24B;
  --felt-1:#35B27B; --felt-2:#1E8A5B; --wood:#B97A3E; --wood-d:#8A5628;
  --font-display:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181330; --surface:#251F47; --surface-2:#332B5C; --fg:#F7F2FF; --muted:#B9AFDA; --line:#40376E;
    --accent:#FF9248; --accent-ink:#FFA566; --on-accent:#2A1405; --bar:#5C4F94; --neg:#FF7D90; --on-neg:#2B0A12; --note:#3A2A1A; --pl:64%; --pc-ink:#171230;
    --edge:#110D24; --accent-deep:#C25A1C; --dot:#211B40; --gold:#3B3322; --gold-line:#8A6B1F;
    --felt-1:#2A8F64; --felt-2:#166A47; --wood:#8A5A2B; --wood-d:#5E3A18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181330; --surface:#251F47; --surface-2:#332B5C; --fg:#F7F2FF; --muted:#B9AFDA; --line:#40376E;
  --accent:#FF9248; --accent-ink:#FFA566; --on-accent:#2A1405; --bar:#5C4F94; --neg:#FF7D90; --on-neg:#2B0A12; --note:#3A2A1A; --pl:64%; --pc-ink:#171230;
  --edge:#110D24; --accent-deep:#C25A1C; --dot:#211B40; --gold:#3B3322; --gold-line:#8A6B1F;
  --felt-1:#2A8F64; --felt-2:#166A47; --wood:#8A5A2B; --wood-d:#5E3A18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  min-height:100vh; padding-top:env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:10}
button{font:inherit; color:inherit; touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.masthead{position:sticky; top:env(safe-area-inset-top, 0px); z-index:9; background:var(--bg); padding-block:14px 10px; display:grid; gap:12px}
.mast-row{display:flex; align-items:center; gap:12px}
.mast-title{flex:1; min-width:0}
h1{margin:0; font:700 26px/1.1 var(--font-display); letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sub{margin:2px 0 0; font-size:13px; color:var(--muted)}
.icon-btn{width:44px; height:44px; border-radius:12px; border:0; background:var(--surface); color:var(--fg); display:grid; place-items:center; cursor:pointer}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--surface-2); border-radius:12px}
.tabs button{height:38px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--fg)}

main{padding-bottom:calc(var(--dock-h, 190px) + 24px)}
body[data-tab="rank"] main{padding-bottom:32px}
body.loading main, body.loading .dock{pointer-events:none; opacity:.7}

.rows{display:grid; gap:8px}
.row{
  appearance:none; width:100%; text-align:left; --pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); background:var(--surface); border:1.5px solid transparent; border-radius:12px;
  padding:10px 12px; display:grid; grid-template-columns:22px 32px minmax(0,1fr) auto; column-gap:10px; align-items:center;
}
button.row{cursor:pointer}
.row.sel{border-color:var(--accent)}
.rank{font:700 15px var(--font-display); color:var(--muted); text-align:center; font-variant-numeric:tabular-nums}
.body{min-width:0; display:block}
.name{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta{display:block; font-size:12px; color:var(--muted)}
.score{font:700 26px/1 var(--font-display); font-variant-numeric:tabular-nums; text-align:right}
.score.negv{color:var(--neg)}
.lead .rank, .lead .score:not(.negv){color:var(--accent-ink)}
.track{position:relative; display:block; height:10px; margin-top:7px; border-radius:5px; background:var(--surface-2); overflow:hidden}
.fill{position:absolute; top:0; bottom:0; border-radius:5px; background:var(--pc, var(--bar)); transition:left .6s cubic-bezier(.34,1.25,.64,1), width .6s cubic-bezier(.34,1.25,.64,1)}
.fill.neg{opacity:.65}
.zero{position:absolute; top:0; bottom:0; width:2px; background:var(--fg); opacity:.35}
.big .track{height:22px; border-radius:7px}
.big .fill{border-radius:7px}
.big .row{padding:12px}

.note{display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:10px; padding:10px 12px; border-radius:10px; background:var(--note); font-size:13px}
.empty{padding:18px 4px; color:var(--muted)}

.add{display:flex; gap:8px; margin-top:12px}
body[data-tab="rank"] .add, body[data-tab="rank"] #addMsg{display:none}
input[type="text"], input[type="number"]{
  flex:1; min-width:0; height:46px; padding:0 12px; font:inherit; font-size:16px; color:var(--fg);
  background:var(--surface); border:1.5px solid var(--line); border-radius:10px; -webkit-appearance:none; appearance:none;
}
input::placeholder{color:var(--muted)}
.btn{height:46px; padding:0 16px; border:0; border-radius:10px; background:var(--accent); color:var(--on-accent); font-weight:600; cursor:pointer; white-space:nowrap}
.btn.ghost{background:var(--surface-2); color:var(--fg)}
.btn.danger{background:var(--neg); color:var(--on-neg)}
.btn.sm{height:38px; padding:0 12px; font-size:14px}
.btn:disabled{opacity:.4; cursor:default}

.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:8; background:var(--surface); border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
body[data-tab="rank"] .dock{display:none}
.dock-head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.dock-who{flex:1; min-width:0}
.dock-who b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dock-score{font:700 22px/1 var(--font-display); font-variant-numeric:tabular-nums; padding-right:4px}
.chips{display:grid; grid-template-columns:repeat(auto-fit, minmax(62px, 1fr)); gap:8px}
.chip{height:52px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font:700 20px var(--font-display); font-variant-numeric:tabular-nums; cursor:pointer}
.chip.plus{color:var(--accent-ink); border-color:var(--accent)}
.chip.minus{color:var(--neg)}
.chip:active:not(:disabled){transform:scale(.96)}
.chip:disabled{opacity:.4; cursor:default}

.overlay{position:fixed; inset:0; z-index:80; background:rgba(8,12,17,.55); display:flex; align-items:flex-end}
.sheet{
  width:100%; max-height:90vh; max-height:90dvh; overflow:auto; background:var(--surface); border-radius:18px 18px 0 0; display:grid; gap:16px;
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet h2{margin:0; font:700 20px var(--font-display)}
.field{display:grid; gap:6px}
.field > span, .label{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.field input{width:100%; flex:none}
.inc-list{display:flex; flex-wrap:wrap; gap:8px}
.inc{display:inline-flex; align-items:center; gap:2px; padding:2px 2px 2px 12px; border-radius:999px; background:var(--surface-2); font:700 16px var(--font-display)}
.inc button{width:32px; height:32px; border:0; border-radius:50%; background:transparent; color:var(--muted); font-size:18px; cursor:pointer}
.inline{display:flex; gap:8px}
.msg{margin:0; min-height:1.2em; font-size:13px; color:var(--muted)}
.stack{display:grid; gap:8px}
.foot{font-size:13px; color:var(--muted); margin:0}

.score-cell{text-align:right; min-width:72px}
.score-cell .score{display:block}
.pend{display:block; margin-top:3px; font:700 13px var(--font-display); font-variant-numeric:tabular-nums; color:var(--accent-ink); text-align:right}
.pend.negp{color:var(--neg)}
.dock-score .pend{margin-top:2px}
.round-bar{display:grid; grid-template-columns:auto 1fr; gap:8px; margin-top:10px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--surface-2); border-radius:12px}
.seg button{height:42px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface); color:var(--fg)}
.seg.three{grid-template-columns:1fr 1fr 1fr}

.crown{position:absolute; top:-9px; left:50%; width:18px; height:14px; margin-left:-9px; transform:rotate(-8deg); color:#F2B705; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}

.podium{display:grid; gap:8px; align-items:end; padding:14px 0 6px}
.pod{--pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); display:grid; justify-items:center; gap:4px; min-width:0}
.pod .av{width:46px; height:46px; font-size:20px; margin-bottom:2px}
.pod .crown{width:26px; height:20px; top:-16px; margin-left:-13px}
.pod-name{max-width:100%; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pod-score{font:700 20px/1 var(--font-display); font-variant-numeric:tabular-nums}
.pod-score.negv{color:var(--neg)}
.pod-block{width:100%; border-radius:10px 10px 4px 4px; background:var(--pc); color:var(--pc-ink); display:grid; place-items:center; font:700 24px var(--font-display); transform-origin:bottom; animation:rise .7s cubic-bezier(.34,1.3,.64,1) both}
@keyframes rise{from{transform:scaleY(.15); opacity:.3}}

.pend.pop{transform-origin:right center; animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.5)}}

.inrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center}
.btn.tall{height:60px; min-width:96px; padding:0 14px}
.dial-wrap{position:relative; min-width:0; height:60px}
.dial{display:flex; height:60px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-x:contain; touch-action:pan-x; background:var(--bg); border:1.5px solid var(--line); border-radius:12px}

.dial-mark{position:absolute; top:5px; bottom:5px; left:50%; width:3px; margin-left:-1.5px; border-radius:2px; background:var(--accent); pointer-events:none}

.wheel-box{display:flex; align-items:center; justify-content:center; gap:16px}

.wheel-side{flex:1 1 0; min-width:0; display:grid; gap:8px; justify-items:start}
.turn-in{width:92px; height:40px; padding:0 8px; font:inherit; font-weight:600; text-align:center; color:var(--fg); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; -webkit-appearance:none; appearance:none; -webkit-appearance:none; appearance:none}

.mini-btn{min-height:36px; height:36px; padding:0 12px; font-size:13px}
.range-in{flex:1; min-width:0; accent-color:var(--accent); height:32px}
.turn-line{display:flex; align-items:center; gap:8px}
.wheel{position:relative; width:min(var(--wheel-size, 190px), 56vw); height:min(var(--wheel-size, 190px), 56vw); container-type:size; flex:none; border-radius:50%; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab}
.wheel:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.wheel-rot{position:absolute; inset:0; border-radius:50%; will-change:transform;
  background:repeating-conic-gradient(var(--muted) 0 1.2deg, transparent 1.2deg 15deg);
  -webkit-mask-image:radial-gradient(circle closest-side, transparent 0 78%, #000 79%); mask-image:radial-gradient(circle closest-side, transparent 0 78%, #000 79%)}

.mini{width:44px; border:0; border-radius:10px; background:var(--surface-2); color:var(--fg); font-size:20px; cursor:pointer}

.game-row{display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:8px; align-items:stretch}
.game-main{appearance:none; -webkit-appearance:none; text-align:left; min-width:0; display:grid; gap:2px; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg); cursor:pointer}

.g-name{display:flex; align-items:center; gap:8px; min-width:0; font-weight:600}

/* Circular table */
.table{--ts:min(calc(100vw - 32px), 380px, max(270px, calc(100svh - var(--dock-h, 190px) - 250px))); --rp:calc(var(--ts) / 2 - var(--s, 40px) / 2 - 12px); position:relative; width:var(--ts); height:calc(var(--ts) + 46px); margin:4px auto 0}
.table-ring{position:absolute; border-radius:50%; border:1.5px dashed var(--line); pointer-events:none; width:calc(var(--rp) * 2); height:calc(var(--rp) * 2); left:calc(50% - var(--rp)); top:calc(16px + var(--ts) / 2 - var(--rp))}
.table-mid{position:absolute; left:50%; top:calc(16px + var(--ts) / 2); width:calc(var(--ts) * .34); transform:translate(-50%,-50%); text-align:center; display:grid; gap:2px; justify-items:center; pointer-events:none}

.table-mid .t-score{font:700 34px/1 var(--font-display); font-variant-numeric:tabular-nums; max-width:100%}
.table-mid .t-score.negv{color:var(--neg)}
.table-mid .t-hint{font-size:12px; color:var(--muted)}
.table-mid .t-rtitle{font:700 clamp(17px, calc(var(--ts) * .068), 26px)/1.05 var(--font-display); text-shadow:0 2px 0 rgba(0,0,0,.18)}
.table-mid .t-cue{font-weight:700; font-size:clamp(11px, calc(var(--ts) * .036), 14px); line-height:1.2; text-wrap:balance}
html[data-skin="wash"] .table-mid .t-rtitle, html[data-skin="plain"] .table-mid .t-rtitle{text-shadow:none}
.table-mid .pend{margin-top:0; text-align:center}
.seat{appearance:none; -webkit-appearance:none; position:absolute; left:calc(50% + var(--rp) * var(--sx)); top:calc(16px + var(--ts) / 2 - var(--rp) * var(--cy)); transform:translate(-50%, calc(var(--s) / -2)); --pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); background:transparent; border:0; padding:0; margin:0; font:inherit; color:var(--fg); display:grid; justify-items:center; gap:1px; cursor:pointer; min-width:0}
.seat .av{width:var(--s); height:var(--s); font-size:calc(var(--s) * .42); transition:box-shadow .15s}
.seat.sel .av{box-shadow:0 0 0 3px var(--bg), 0 0 0 5.5px var(--accent)}
.seat.has-pend:not(.sel) .av{box-shadow:0 0 0 2px var(--accent)}
.seat-name{font-size:11px; line-height:1.15; max-width:min(calc(var(--sp, 60px) - 6px), calc(var(--s) + 14px)); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted)}
.seat-score{font:700 12px/1.15 var(--font-display); font-variant-numeric:tabular-nums; white-space:nowrap; max-width:calc(var(--s) + 14px)}
.seat-score.negv{color:var(--neg)}
.table.m-compact .seat-name, .table.m-dense .seat-name{display:none}
.table.m-dense .seat-score{position:absolute; left:0; width:var(--s); top:calc(var(--s) * .52); max-width:none; text-align:center; color:var(--pc-ink); font-size:calc(var(--s) * .32); line-height:1}
.table.m-dense .seat .av{padding-bottom:calc(var(--s) * .3); font-size:calc(var(--s) * .36); box-sizing:border-box}
.seat-pend{position:absolute; top:-6px; left:calc(50% + var(--s) * .28); padding:1px 5px; border-radius:999px; background:var(--accent); color:var(--on-accent); font:700 10px/1.3 var(--font-display); white-space:nowrap; z-index:2}
.seat.pl .seat-pend{left:auto; right:calc(50% + var(--s) * .28)}
.seat.todo .av{outline:2.5px dashed var(--muted); outline-offset:2px; opacity:.82}
.seat.todo .seat-name{font-weight:700}
.seat.scored:not(.sel) .av{box-shadow:0 0 0 2px var(--accent)}
.table-mid .t-prog{font-weight:700; color:var(--on-felt, #FFE29A)}
.table-mid .t-prog.all{color:#B8F5D2}
.round-prog{grid-column:1 / -1; display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--muted); min-width:0}
.round-prog .rp-txt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.round-prog.all{color:var(--accent-ink)}
.rp-dots{display:inline-flex; gap:3px; flex:none}
.rp-dots i{width:8px; height:8px; border-radius:50%; border:1.5px solid var(--muted); box-sizing:border-box}
.rp-dots i.on{background:var(--accent); border-color:var(--accent)}
.round-prog .rp-mark{margin-left:auto; flex:none; min-height:30px; padding:0 12px; font-size:12px}
.prow.todo{opacity:.7}
.seat-pend.negp{background:var(--neg); color:var(--on-neg)}
.seat-pend.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.table.m-dense .seat-pend, .table.m-tight .seat-pend{top:auto; bottom:calc(var(--s) * .1); left:calc(50% + var(--s) * .12); font-size:clamp(8px, calc(var(--s) * .27), 11px); padding:0 3px; box-shadow:0 0 0 1.5px var(--bg)}
.table.m-dense .seat.pl .seat-pend, .table.m-tight .seat.pl .seat-pend{left:auto; right:calc(50% + var(--s) * .12)}
.seat .crown{top:-8px; width:15px; height:11px; margin-left:-7px}

/* Round chart */
.chart-card{background:var(--surface); border-radius:12px; padding:12px 12px 10px; margin-top:6px}

/* Features */

.stand{display:grid}
.stand-row{--pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); display:grid; grid-template-columns:22px 28px minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line)}

.stand-row b{font-variant-numeric:tabular-nums}
.hl{padding:10px 12px; border-radius:10px; background:var(--surface-2); font-size:14px}
.hl em{display:block; font-style:normal; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.share-img{width:100%; border-radius:12px; display:block}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* Presentation mode */
.pres{position:fixed; inset:0; z-index:60; display:grid; grid-template-rows:auto minmax(0,1fr); gap:clamp(8px, 2vmin, 22px); background-color:var(--bg); color:var(--fg); font-family:var(--font-body);
  padding:max(12px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); overflow:hidden}

.pr-meta .t-time{font-size:clamp(18px, 4.2vmin, 46px); color:#F2F5F8; cursor:pointer}

.pr-body{display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 6fr); gap:clamp(10px, 2.4vmin, 28px); min-height:0}
@media (orientation:portrait){ .pr-body{grid-template-columns:minmax(0, 1fr); grid-template-rows:minmax(0, 1.15fr) minmax(0, .85fr)} }
.pr-list{container-type:size; display:flex; flex-direction:column; gap:clamp(4px, 1.5cqh, 16px); min-height:0}
.prow{--pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); flex:1 1 0; min-height:0; display:grid; grid-template-columns:1.2em 1.9em minmax(0, 1fr) auto; align-items:center; gap:.45em; font-size:clamp(11px, min(calc(100cqh / var(--n) * .38), 6.4cqw), 46px); padding:0 .55em; border-radius:.5em; background:#171E26}

.pr-chart{display:grid; grid-template-rows:auto minmax(0, 1fr); gap:.5em; min-height:0; padding:clamp(8px, 1.8vmin, 20px); border-radius:clamp(10px, 2vmin, 22px); background:#171E26}
.pr-ct{font:700 clamp(14px, 3vmin, 32px) var(--font-display)}
.pr-cb{position:relative; min-height:0; min-width:0}
.pr-cb svg{position:absolute; inset:0; width:100%; height:100%}

.pr-fade{transition:opacity .3s}

html[data-skin="wash"] h1, html[data-skin="wash"] .sheet h2{font-family:var(--font-display); font-weight:700; letter-spacing:.06em}
html[data-skin="wash"] h1::after{content:""; display:block; width:96px; height:5px; margin-top:5px; background:linear-gradient(90deg, var(--fg) 0, var(--fg) 62%, transparent); border-radius:60% 20% 50% 30% / 90% 40% 80% 30%; opacity:.85}
html[data-skin="wash"] .sub{font-weight:500}
html[data-skin="wash"] .icon-btn, html[data-skin="wash"] .row, html[data-skin="wash"] .strip, html[data-skin="wash"] .chart-card, html[data-skin="wash"] .chip, html[data-skin="wash"] .btn.ghost, html[data-skin="wash"] .pill, html[data-skin="wash"] .tr-row, html[data-skin="wash"] .note{border:1px solid color-mix(in srgb, var(--fg) 38%, transparent); border-radius:3px; box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 6px 14px -10px rgba(38,42,51,.5)}
html[data-skin="wash"] .row{border-radius:3px}
html[data-skin="wash"] .tabs, html[data-skin="wash"] .seg{border:1px solid color-mix(in srgb, var(--fg) 38%, transparent); border-radius:3px}
html[data-skin="wash"] .tabs button, html[data-skin="wash"] .seg button{border-radius:2px; font-weight:700}
html[data-skin="wash"] .tabs button[aria-selected="true"], html[data-skin="wash"] .seg button[aria-checked="true"]{background:var(--accent); color:var(--on-accent); box-shadow:none}
html[data-skin="wash"] .btn, html[data-skin="wash"] .btn.danger{border-radius:3px; font-weight:700; box-shadow:0 2px 0 var(--accent-deep)}
html[data-skin="wash"] .btn.ghost{box-shadow:0 6px 14px -10px rgba(38,42,51,.5); background:transparent}
html[data-skin="wash"] .dock{border-radius:0; border-top:1px solid color-mix(in srgb, var(--fg) 35%, transparent); box-shadow:0 -10px 24px -14px rgba(38,42,51,.45)}
html[data-skin="wash"] .sheet{border-radius:0; border-top:1px solid color-mix(in srgb, var(--fg) 35%, transparent)}
html[data-skin="wash"] .av{box-shadow:0 0 0 2px var(--surface), 0 0 0 3px color-mix(in srgb, var(--fg) 55%, transparent)}
html[data-skin="wash"] .table-felt{border:0; border-radius:50%; background:radial-gradient(70% 55% at 28% 22%, var(--b1), transparent 72%), radial-gradient(60% 50% at 74% 80%, var(--b2), transparent 74%), radial-gradient(44% 34% at 18% 78%, var(--b3), transparent 72%), var(--felt-1); box-shadow:0 14px 26px -16px rgba(38,42,51,.55), inset 0 0 30px rgba(38,42,51,.07)}
html[data-skin="wash"] .table-felt::before{content:""; position:absolute; inset:-7px; border-radius:50%; transform:none; border:0; background:conic-gradient(from 212deg, transparent 0, #262A33 16deg, #262A33 326deg, transparent 350deg); -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px), #000 calc(100% - 3px), transparent calc(100% - 2px)); mask:radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px), #000 calc(100% - 3px), transparent calc(100% - 2px)); opacity:.88}
html[data-skin="wash"] .table-felt::after{content:""; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 50% 24%, #C8452D 0 6.5%, transparent 7%), linear-gradient(180deg, transparent 60%, rgba(255,255,255,.55) 70%, transparent 82%); opacity:.9}
html[data-skin="wash"] .table-ring{border:1px dotted color-mix(in srgb, var(--fg) 28%, transparent)}
html[data-skin="wash"] .table-mid, html[data-skin="wash"] .table-mid .t-name, html[data-skin="wash"] .table-mid .t-score{color:var(--fg); text-shadow:none}
html[data-skin="wash"] .seat-name{background:var(--surface); color:var(--fg); border:1px solid color-mix(in srgb, var(--fg) 45%, transparent); border-radius:2px; box-shadow:none}

<body>

</header>

<main>

</div>

      h("div", {class: "stack"}, h("span", {class: "label"}, "Game library"), libList, h("p", {class: "foot"}, "Loading a game sets who wins, the target and the round plan, and puts its round info in the middle of the table. Scores stay as they are. Tap Edit to change the rules for how you play; edits and custom games are kept on this device.")),

        h("button", {class: "btn ghost", type: "button", onclick: function(){ state.incs = DEFAULT_INCS.slice(); incMsg.textContent = ""; drawIncs(); renderDock(); save(); }}, "Use default amounts")),

  function loadGame(g){
    if (!g){ state.game = ""; state.gdef = null; save(); render(); return; }
    state.game = g.id; state.gdef = JSON.parse(JSON.stringify(g));
    state.lowWins = g.low; state.target = g.target; state.targetHit = false;
    var pl = g.plan.slice();
    if (g.cycle) while (pl.length < 12) pl = pl.concat(g.plan);
    state.plan = pl.slice(0, 30);
    state.feat.rounds = true; if (g.target) state.feat.target = true;
    if (/^(Game night|New game)/.test(state.title)) state.title = g.name;
    save(); render();
  }
  function openGameEditor(g0){
    var isNew = !g0 || !g0.id || !(userLib[g0.id] || BUILTIN[g0.id]);
    var g = normG(g0 || {name: "My game"}, g0 && g0.id) , low = g.low;
    var f = function(id, label, node){ return h("label", {class: "field", for: id}, h("span", {}, label), node); };
    var nameIn = h("input", {type: "text", id: "gName", maxlength: 30, value: g.name, autocomplete: "off"});
    var unitIn = h("input", {type: "text", id: "gUnit", maxlength: 12, value: g.unit, autocomplete: "off", placeholder: "Round, Hole, Hand…"});
    var totIn = h("input", {type: "number", inputmode: "numeric", min: "0", max: "60", id: "gTot", value: String(g.total)});
    var tgtIn = h("input", {type: "number", inputmode: "numeric", min: "0", id: "gTgt", value: String(g.target)});
    var noteIn = h("input", {type: "text", id: "gNote", maxlength: 30, value: g.note, autocomplete: "off", placeholder: "Shown in the middle, e.g. First to 100"});
    var planIn = h("textarea", {class: "ta", id: "gPlan", maxlength: 1500, placeholder: "One per line, for example:\n2 sets of 3\n1 set + 1 run of 4"}); planIn.value = g.plan.join("\n");
    var cyc = h("input", {type: "checkbox", id: "gCyc"}); cyc.checked = g.cycle;
    var seg = h("div", {class: "seg", role: "radiogroup", "aria-label": "Who wins"}), msg = h("p", {class: "msg", "aria-live": "polite"});
    function drawSeg(){ seg.replaceChildren.apply(seg, [["High score wins", false], ["Low score wins", true]].map(function(o){
      return h("button", {type: "button", role: "radio", "aria-checked": String(low === o[1]), onclick: function(){ low = o[1]; drawSeg(); }}, o[0]); })); }
    drawSeg();

        plan: planIn.value.split("\n")}, g.id);
    }
    function commit(load){
      var d = read(), isB = !!BUILTIN[g.id];
      if (!d.name.trim()){ msg.textContent = "Give it a name."; return; }

        if (Object.keys(userLib).filter(function(k){ return !BUILTIN[k]; }).length >= MAX_CUSTOM){ msg.textContent = "You can keep up to " + MAX_CUSTOM + " custom games."; return; }
        d.id = "c" + uid(); d.blurb = "";
      } else d.id = g.id;
      d.blurb = "";
      userLib[d.id] = d; saveUserLib();
      if (load) loadGame(d);
      closeSheet(); openSettings("game");
    }
    var extra = [];
    if (!isNew && BUILTIN[g.id] && userLib[g.id]) extra.push(confirmBtn("Reset to original rules", "Tap again to reset", function(){ delete userLib[g.id]; saveUserLib(); closeSheet(); openSettings("game"); }));
    if (!isNew && !BUILTIN[g.id]) extra.push(confirmBtn("Delete this game", "Tap again to delete", function(){ delete userLib[g.id]; saveUserLib(); closeSheet(); openSettings("game"); }));

  function openEdit(id){

  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var t = setTimeout(function(){ reject(new Error("timeout")); }, ms);
      promise.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
    });
  }

  function localLoad(){
    try {
      var raw = localStorage.getItem(LIB_KEY);
      if (raw){
        var o = JSON.parse(raw), out = {cur: o && o.cur, games: {}, roster: normRoster(o && o.roster)};
        if (o && o.games) Object.keys(o.games).forEach(function(id){ var g = normalize(o.games[id]); if (g) out.games[id] = g; });
        return out;
      }
      var old = localStorage.getItem(LS_KEY);
      if (old){
        var g1 = normalize(JSON.parse(old));
        if (g1){ var id1 = uid(), games = {}; g1.updated = Date.now(); games[id1] = g1; return {cur: id1, games: games, roster: {}}; }
      }
    } catch (e) {}
    return null;
  }

  async function init(){
    applySkin(getSkin()); applyWheelSize();
    document.body.classList.add("loading");
    render();
    var legacy = null, curId = null, fresh = null;
    try {
      if (window.claude && window.claude.use){
        var parts = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        var db = parts[0], user = parts[1], uidv = user ? await user.id() : null;
        if (db && uidv){
          var col = db.collection("data/users/" + uidv);
          var qs = await withTimeout(col.get(), 8000);
          qs.docs.forEach(function(d){
            var k = d.id, v = d.data();
            if (!v) return;
            if (k.slice(0, 2) === "g-"){ var g = normalize(v); if (g) lib.games[k.slice(2)] = g; }

          docs = col; storeMode = "account";
        }

    if (!docs){
      storeMode = "device";
      var loc = localLoad();
      if (loc){ lib.games = loc.games; lib.roster = loc.roster || {}; curId = loc.cur; }
    } else if (!Object.keys(lib.games).length && legacy){
      var lg = normalize(legacy);
      if (lg){ fresh = uid(); lg.updated = Date.now(); lib.games[fresh] = lg; curId = fresh; }
    }
    var ids = gameIds();
    if (!ids.length){
      fresh = uid();
      var sg = normalize(sampleState()); sg.updated = Date.now();
      lib.games[fresh] = sg; curId = fresh; ids = [fresh];
    }
    if (!curId || !lib.games[curId]) curId = ids[0];
    lib.cur = curId;
    state = normalize(lib.games[curId]) || normalize(sampleState());
    selectedId = null;
    hydrated = true;
    if (fresh){ persistGame(fresh); persistCur(); } else if (!docs){ localWrite(); }
    document.body.classList.remove("loading");
    render();
  }
  init();
  if ("serviceWorker" in navigator){

  }
})();
