<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round Tally</title>
<meta name="theme-color" content="#FFF3DD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181330" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Round Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: sticky masthead with Score / Ranking tabs, one list of bar rows, a fixed scoring dock at the bottom (Score tab only). Scoreboard amber on graphite. */
:root{
  --bg:#FFF3DD; --surface:#FFFFFF; --surface-2:#FFE6BD; --fg:#2B2350; --muted:#675F88; --line:#F1D8A8;
  --accent:#D6420A; --accent-ink:#B23506; --on-accent:#FFFFFF; --bar:#B9ACE0; --neg:#C8283F; --on-neg:#FFFFFF; --note:#FFE29A; --pl:38%; --pc-ink:#FFFFFF;
  --edge:#E6C384; --accent-deep:#8F2D04; --dot:#F6DEB2; --gold:#FFF0C2; --gold-line:#F0C24B;
  --felt-1:#35B27B; --felt-2:#1E8A5B; --wood:#B97A3E; --wood-d:#8A5628;
  --font-display:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181330; --surface:#251F47; --surface-2:#332B5C; --fg:#F7F2FF; --muted:#B9AFDA; --line:#40376E;
    --accent:#FF9248; --accent-ink:#FFA566; --on-accent:#2A1405; --bar:#5C4F94; --neg:#FF7D90; --on-neg:#2B0A12; --note:#3A2A1A; --pl:64%; --pc-ink:#171230;
    --edge:#110D24; --accent-deep:#C25A1C; --dot:#211B40; --gold:#3B3322; --gold-line:#8A6B1F;
    --felt-1:#2A8F64; --felt-2:#166A47; --wood:#8A5A2B; --wood-d:#5E3A18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181330; --surface:#251F47; --surface-2:#332B5C; --fg:#F7F2FF; --muted:#B9AFDA; --line:#40376E;
  --accent:#FF9248; --accent-ink:#FFA566; --on-accent:#2A1405; --bar:#5C4F94; --neg:#FF7D90; --on-neg:#2B0A12; --note:#3A2A1A; --pl:64%; --pc-ink:#171230;
  --edge:#110D24; --accent-deep:#C25A1C; --dot:#211B40; --gold:#3B3322; --gold-line:#8A6B1F;
  --felt-1:#2A8F64; --felt-2:#166A47; --wood:#8A5A2B; --wood-d:#5E3A18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  min-height:100vh; padding-top:env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:10}
button{font:inherit; color:inherit; touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.masthead{position:sticky; top:env(safe-area-inset-top, 0px); z-index:9; background:var(--bg); padding-block:14px 10px; display:grid; gap:12px}
.mast-row{display:flex; align-items:center; gap:12px}
.mast-title{flex:1; min-width:0}
h1{margin:0; font:700 26px/1.1 var(--font-display); letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sub{margin:2px 0 0; font-size:13px; color:var(--muted)}
.icon-btn{width:44px; height:44px; border-radius:12px; border:0; background:var(--surface); color:var(--fg); display:grid; place-items:center; cursor:pointer}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--surface-2); border-radius:12px}
.tabs button{height:38px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--fg)}

main{padding-bottom:calc(var(--dock-h, 190px) + 24px)}
body[data-tab="rank"] main{padding-bottom:calc(32px + env(safe-area-inset-bottom, 0px))}

.rows{display:grid; gap:8px}
.row{
  appearance:none; width:100%; text-align:left; --pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); background:var(--surface); border:1.5px solid transparent; border-radius:12px;
  padding:10px 12px; display:grid; grid-template-columns:22px 32px minmax(0,1fr) auto; column-gap:10px; align-items:center;
}
button.row{cursor:pointer}
.row.sel{border-color:var(--accent)}
.rank{font:700 15px var(--font-display); color:var(--muted); text-align:center; font-variant-numeric:tabular-nums}
.body{min-width:0; display:block}
.name{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta{display:block; font-size:12px; color:var(--muted)}
.score{font:700 26px/1 var(--font-display); font-variant-numeric:tabular-nums; text-align:right}
.score.negv{color:var(--neg)}
.lead .rank, .lead .score:not(.negv){color:var(--accent-ink)}
.track{position:relative; display:block; height:10px; margin-top:7px; border-radius:5px; background:var(--surface-2); overflow:hidden}
.fill{position:absolute; top:0; bottom:0; border-radius:5px; background:var(--pc, var(--bar)); transition:left .6s cubic-bezier(.34,1.25,.64,1), width .6s cubic-bezier(.34,1.25,.64,1)}
.fill.neg{opacity:.65}
.zero{position:absolute; top:0; bottom:0; width:2px; background:var(--fg); opacity:.35}
.big .track{height:22px; border-radius:7px}
.big .fill{border-radius:7px}
.big .row{padding:12px}

.note{display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:10px; padding:10px 12px; border-radius:10px; background:var(--note); font-size:13px}
.empty{padding:18px 4px; color:var(--muted)}

.add{display:flex; gap:8px; margin-top:12px}
body[data-tab="rank"] .add, body[data-tab="rank"] #addMsg{display:none}
input[type="text"], input[type="number"]{
  flex:1; min-width:0; height:46px; padding:0 12px; font:inherit; font-size:16px; color:var(--fg);
  background:var(--surface); border:1.5px solid var(--line); border-radius:10px; -webkit-appearance:none; appearance:none;
}
input::placeholder{color:var(--muted)}
.btn{height:46px; padding:0 16px; border:0; border-radius:10px; background:var(--accent); color:var(--on-accent); font-weight:600; cursor:pointer; white-space:nowrap}
.btn.ghost{background:var(--surface-2); color:var(--fg)}
.btn.danger{background:var(--neg); color:var(--on-neg)}
.btn.sm{height:38px; padding:0 12px; font-size:14px}
.btn:disabled{opacity:.4; cursor:default}

.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:8; background:var(--surface); border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
body[data-tab="rank"] .dock{display:none}
.dock-head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.dock-who{flex:1; min-width:0}
.dock-who b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dock-score{font:700 22px/1 var(--font-display); font-variant-numeric:tabular-nums; padding-right:4px}
.chips{display:grid; grid-template-columns:repeat(auto-fit, minmax(62px, 1fr)); gap:8px}
.chip{height:52px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font:700 20px var(--font-display); font-variant-numeric:tabular-nums; cursor:pointer}
.chip.plus{color:var(--accent-ink); border-color:var(--accent)}
.chip.minus{color:var(--neg)}
.chip:active:not(:disabled){transform:scale(.96)}
.chip:disabled{opacity:.4; cursor:default}

.overlay{position:fixed; inset:0; z-index:80; background:rgba(8,12,17,.55); display:flex; align-items:flex-end}
.sheet{
  width:100%; max-height:90vh; max-height:90dvh; overflow:auto; background:var(--surface); border-radius:18px 18px 0 0; display:grid; gap:16px;
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet h2{margin:0; font:700 20px var(--font-display)}
.field{display:grid; gap:6px}
.field > span, .label{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.field input{width:100%; flex:none}
.inc-list{display:flex; flex-wrap:wrap; gap:8px}
.inc{display:inline-flex; align-items:center; gap:2px; padding:2px 2px 2px 12px; border-radius:999px; background:var(--surface-2); font:700 16px var(--font-display)}
.inc button{width:32px; height:32px; border:0; border-radius:50%; background:transparent; color:var(--muted); font-size:18px; cursor:pointer}
.inline{display:flex; gap:8px}
.msg{margin:0; min-height:1.2em; font-size:13px; color:var(--muted)}
.stack{display:grid; gap:8px}
.foot{font-size:13px; color:var(--muted); margin:0}

.score-cell{text-align:right; min-width:72px}
.score-cell .score{display:block}
.pend{display:block; margin-top:3px; font:700 13px var(--font-display); font-variant-numeric:tabular-nums; color:var(--accent-ink); text-align:right}
.pend.negp{color:var(--neg)}
.dock-score .pend{margin-top:2px}
.round-bar{display:grid; grid-template-columns:auto 1fr; gap:8px; margin-top:10px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--surface-2); border-radius:12px}
.seg button{height:42px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface); color:var(--fg)}
.seg.three{grid-template-columns:1fr 1fr 1fr}

.av{position:relative; width:32px; height:32px; border-radius:50%; background:var(--pc); color:var(--pc-ink); display:grid; place-items:center; font:700 15px var(--font-display)}
.crown{position:absolute; top:-9px; left:50%; width:18px; height:14px; margin-left:-9px; transform:rotate(-8deg); color:#F2B705; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}

.podium{display:grid; gap:8px; align-items:end; padding:14px 0 6px}
.pod{--pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); display:grid; justify-items:center; gap:4px; min-width:0}
.pod .av{width:46px; height:46px; font-size:20px; margin-bottom:2px}
.pod .crown{width:26px; height:20px; top:-16px; margin-left:-13px}
.pod-name{max-width:100%; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pod-score{font:700 20px/1 var(--font-display); font-variant-numeric:tabular-nums}
.pod-score.negv{color:var(--neg)}
.pod-block{width:100%; border-radius:10px 10px 4px 4px; background:var(--pc); color:var(--pc-ink); display:grid; place-items:center; font:700 24px var(--font-display); transform-origin:bottom; animation:rise .7s cubic-bezier(.34,1.3,.64,1) both}
@keyframes rise{from{transform:scaleY(.15); opacity:.3}}

.pend.pop{transform-origin:right center; animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.5)}}

.inrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center}
.btn.tall{height:60px; min-width:96px; padding:0 14px}
.dial-wrap{position:relative; min-width:0; height:60px}
.dial{display:flex; height:60px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-x:contain; touch-action:pan-x; background:var(--bg); border:1.5px solid var(--line); border-radius:12px}
.dial::-webkit-scrollbar{display:none}
.dial-pad{flex:none; width:calc(50% - 26px)}
.tick{flex:none; width:52px; scroll-snap-align:center; display:grid; align-content:end; justify-items:center; gap:5px; padding-bottom:7px; font:700 15px var(--font-display); font-variant-numeric:tabular-nums; color:var(--muted); transition:color .15s}
.tick::before{content:""; width:2px; height:11px; border-radius:1px; background:var(--line)}
.tick.mj::before{height:19px; background:var(--muted)}
.tick.on{color:var(--fg)}
.dial-mark{position:absolute; top:5px; bottom:5px; left:50%; width:3px; margin-left:-1.5px; border-radius:2px; background:var(--accent); pointer-events:none}
.dial-fade{position:absolute; inset:0; border-radius:12px; pointer-events:none; background:linear-gradient(90deg, var(--bg), transparent 28%, transparent 72%, var(--bg))}
.wheel-box{display:flex; align-items:center; justify-content:center; gap:16px}
.dock.lefty .wheel-box{flex-direction:row-reverse}
.dock.lefty .round-bar{flex-direction:row-reverse}
.wheel-side{flex:1 1 0; min-width:0; display:grid; gap:8px; justify-items:start}
.turn-in{width:92px; height:40px; padding:0 8px; font:inherit; font-weight:600; text-align:center; color:var(--fg); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; -webkit-appearance:none; appearance:none; -webkit-appearance:none; appearance:none}
.turn-big{font:700 22px/1.1 var(--font-display); font-variant-numeric:tabular-nums}
.mini-btn{min-height:36px; height:36px; padding:0 12px; font-size:13px}
.range-in{flex:1; min-width:0; accent-color:var(--accent); height:32px}
.turn-line{display:flex; align-items:center; gap:8px}
.wheel{position:relative; width:min(var(--wheel-size, 190px), 56vw); height:min(var(--wheel-size, 190px), 56vw); container-type:size; flex:none; border-radius:50%; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab}
.wheel:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.wheel-rot{position:absolute; inset:0; border-radius:50%; will-change:transform;
  background:repeating-conic-gradient(var(--muted) 0 1.2deg, transparent 1.2deg 15deg);
  -webkit-mask-image:radial-gradient(circle closest-side, transparent 0 78%, #000 79%); mask-image:radial-gradient(circle closest-side, transparent 0 78%, #000 79%)}
.wheel-dot{position:absolute; left:50%; top:7px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.35)}
.wheel.neg .wheel-dot{background:var(--neg)}
.wheel.off{opacity:.55; cursor:default}
.wheel-hub{pointer-events:none; position:absolute; left:50%; top:50%; width:54%; height:54%; margin:0; transform:translate(-50%,-50%); border-radius:50%; border:0; background:var(--surface); color:var(--fg); box-shadow:0 1px 6px rgba(0,0,0,.25); display:grid; place-content:center; gap:0; font:inherit}
.wheel-hub b{font-family:var(--font-display); font-size:clamp(15px, 11cqw, 28px); line-height:1.1; font-variant-numeric:tabular-nums}
.wheel-hub span{font-size:clamp(8px, 5.4cqw, 12px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-ink)}
.wheel.neg .wheel-hub span{color:var(--neg)}
.scale-row{display:flex; align-items:center; gap:6px; margin-bottom:8px}
.scale-row .meta{flex:none}
.scale-row .range{margin-left:auto}
.sc{height:30px; min-width:44px; padding:0 10px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); color:var(--muted); font:700 13px var(--font-display); font-variant-numeric:tabular-nums; cursor:pointer}
.sc[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}

.mini{width:44px; border:0; border-radius:10px; background:var(--surface-2); color:var(--fg); font-size:20px; cursor:pointer}
.mini.armed{width:auto; padding:0 12px; font-size:13px; font-weight:600; background:var(--neg); color:var(--on-neg)}
.game-row{display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:8px; align-items:stretch}
.game-main{appearance:none; -webkit-appearance:none; text-align:left; min-width:0; display:grid; gap:2px; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg); cursor:pointer}
.game-row.cur .game-main{border-color:var(--accent)}
.g-name{display:flex; align-items:center; gap:8px; min-width:0; font-weight:600}
.g-tag{flex:none; padding:1px 8px; border-radius:999px; background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.g-meta{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* Circular table */
.table{--ts:min(calc(100vw - 32px), 380px, max(270px, calc(100svh - var(--dock-h, 190px) - 250px))); --rp:calc(var(--ts) / 2 - var(--s, 40px) / 2 - 12px); position:relative; width:var(--ts); height:calc(var(--ts) + 46px); margin:4px auto 0}
.table-ring{position:absolute; border-radius:50%; border:1.5px dashed var(--line); pointer-events:none; width:calc(var(--rp) * 2); height:calc(var(--rp) * 2); left:calc(50% - var(--rp)); top:calc(16px + var(--ts) / 2 - var(--rp))}
.table-mid{position:absolute; left:50%; top:calc(16px + var(--ts) / 2); width:calc(var(--ts) * .34); transform:translate(-50%,-50%); text-align:center; display:grid; gap:2px; justify-items:center; pointer-events:none}
.table-mid .t-name{font-weight:600; font-size:15px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.table-mid .t-score{font:700 34px/1 var(--font-display); font-variant-numeric:tabular-nums; max-width:100%}
.table-mid .t-score.negv{color:var(--neg)}
.table-mid .t-hint{font-size:12px; color:var(--muted)}
.table-mid .t-rtitle{font:700 clamp(17px, calc(var(--ts) * .068), 26px)/1.05 var(--font-display); text-shadow:0 2px 0 rgba(0,0,0,.18)}
.table-mid .t-cue{font-weight:700; font-size:clamp(11px, calc(var(--ts) * .036), 14px); line-height:1.2; text-wrap:balance}
html[data-skin="wash"] .table-mid .t-rtitle, html[data-skin="plain"] .table-mid .t-rtitle{text-shadow:none}
.table-mid .pend{margin-top:0; text-align:center}
.seat{appearance:none; -webkit-appearance:none; position:absolute; left:calc(50% + var(--rp) * var(--sx)); top:calc(16px + var(--ts) / 2 - var(--rp) * var(--cy)); transform:translate(-50%, calc(var(--s) / -2)); --pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); background:transparent; border:0; padding:0; margin:0; font:inherit; color:var(--fg); display:grid; justify-items:center; gap:1px; cursor:pointer; min-width:0}
.seat .av{width:var(--s); height:var(--s); font-size:calc(var(--s) * .42); transition:box-shadow .15s}
.seat.sel .av{box-shadow:0 0 0 3px var(--bg), 0 0 0 5.5px var(--accent)}
.seat.has-pend:not(.sel) .av{box-shadow:0 0 0 2px var(--accent)}
.seat-name{font-size:11px; line-height:1.15; max-width:min(calc(var(--sp, 60px) - 6px), calc(var(--s) + 14px)); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted)}
.seat-score{font:700 12px/1.15 var(--font-display); font-variant-numeric:tabular-nums; white-space:nowrap; max-width:calc(var(--s) + 14px)}
.seat-score.negv{color:var(--neg)}
.table.m-compact .seat-name, .table.m-dense .seat-name{display:none}
.table.m-dense .seat-score{position:absolute; left:0; width:var(--s); top:calc(var(--s) * .52); max-width:none; text-align:center; color:var(--pc-ink); font-size:calc(var(--s) * .32); line-height:1}
.table.m-dense .seat .av{padding-bottom:calc(var(--s) * .3); font-size:calc(var(--s) * .36); box-sizing:border-box}
.seat-pend{position:absolute; top:-6px; left:calc(50% + var(--s) * .28); padding:1px 5px; border-radius:999px; background:var(--accent); color:var(--on-accent); font:700 10px/1.3 var(--font-display); white-space:nowrap; z-index:2}
.seat.pl .seat-pend{left:auto; right:calc(50% + var(--s) * .28)}
.seat.todo .av{outline:2.5px dashed var(--muted); outline-offset:2px; opacity:.82}
.seat.todo .seat-name{font-weight:700}
.seat.scored:not(.sel) .av{box-shadow:0 0 0 2px var(--accent)}
.table-mid .t-prog{font-weight:700; color:var(--on-felt, #FFE29A)}
.table-mid .t-prog.all{color:#B8F5D2}
.round-prog{grid-column:1 / -1; display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--muted); min-width:0}
.round-prog .rp-txt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.round-prog.all{color:var(--accent-ink)}
.rp-dots{display:inline-flex; gap:3px; flex:none}
.rp-dots i{width:8px; height:8px; border-radius:50%; border:1.5px solid var(--muted); box-sizing:border-box}
.rp-dots i.on{background:var(--accent); border-color:var(--accent)}
.round-prog .rp-mark{margin-left:auto; flex:none; min-height:30px; padding:0 12px; font-size:12px}
.prow.todo{opacity:.7}
.seat-pend.negp{background:var(--neg); color:var(--on-neg)}
.seat-pend.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.table.m-dense .seat-pend, .table.m-tight .seat-pend{top:auto; bottom:calc(var(--s) * .1); left:calc(50% + var(--s) * .12); font-size:clamp(8px, calc(var(--s) * .27), 11px); padding:0 3px; box-shadow:0 0 0 1.5px var(--bg)}
.table.m-dense .seat.pl .seat-pend, .table.m-tight .seat.pl .seat-pend{left:auto; right:calc(50% + var(--s) * .12)}
.seat .crown{top:-8px; width:15px; height:11px; margin-left:-7px}

/* Round chart */
.chart-card{background:var(--surface); border-radius:12px; padding:12px 12px 10px; margin-top:6px}
.chart-card h3{margin:0 0 2px; font:700 16px var(--font-display)}
.chart-card .sub{margin:0 0 6px; font-size:12px; color:var(--muted)}
.chart-wrap{position:relative}
.chart-wrap svg{display:block; width:100%; height:auto; touch-action:pan-y; user-select:none; -webkit-user-select:none}
.chart-tip{position:absolute; top:4px; z-index:2; min-width:120px; max-width:190px; padding:8px 10px; border-radius:10px; background:var(--fg); color:var(--bg); font-size:12px; line-height:1.35; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chart-tip b{display:block; margin-bottom:3px}
.chart-tip .tr{display:flex; align-items:center; gap:6px}
.chart-tip .tr i{flex:none; width:9px; height:9px; border-radius:50%; background:var(--pc)}
.chart-tip .tr span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chart-tip .tr em{margin-left:auto; padding-left:6px; font-style:normal; font-weight:700; font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.lg{appearance:none; -webkit-appearance:none; --pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 8px; border:1.5px solid var(--line); border-radius:999px; background:var(--bg); color:var(--fg); font:inherit; font-size:12px; cursor:pointer}
.lg i{width:9px; height:9px; border-radius:50%; background:var(--pc)}
.lg[aria-pressed="true"]{border-color:var(--accent)}
.chart-tools{display:flex; gap:8px; margin-top:8px}
.tbl-wrap{margin-top:8px; overflow-x:auto}
.tbl{border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; width:100%}
.tbl th, .tbl td{padding:4px 8px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl th:first-child, .tbl td:first-child{text-align:left; position:sticky; left:0; background:var(--surface)}

/* Features */
.strip{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:8px 12px; background:var(--surface); border-radius:12px; margin:8px 0 0}
.st-main{display:grid; min-width:0; flex:1 1 140px}
.st-k{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.st-main b{font:700 17px var(--font-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill{appearance:none; -webkit-appearance:none; border:0; border-radius:999px; background:var(--surface-2); color:var(--fg); font:inherit; font-size:13px; font-weight:600; padding:6px 12px; min-height:34px; cursor:pointer}
.st-timer{display:flex; align-items:center; gap:6px}
.t-time{font:700 18px var(--font-display); font-variant-numeric:tabular-nums; min-width:46px}
.t-time.over{color:var(--neg)}
.st-target{font-size:13px; font-weight:600; color:var(--muted)}
.seat-dealer{position:absolute; left:calc(50% - var(--s) * .62); top:calc(var(--s) - 14px); width:16px; height:16px; border-radius:50%; background:var(--fg); color:var(--bg); font:700 9px/16px var(--font-display); text-align:center; box-shadow:0 0 0 2px var(--bg)}
.sw{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line)}
.sw > span{flex:1; display:grid; gap:2px; min-width:0}
.sw small{color:var(--muted); font-size:12.5px; line-height:1.3}
.sw input{appearance:none; -webkit-appearance:none; flex:none; width:50px; height:30px; margin:0; border-radius:999px; background:var(--surface-2); position:relative; cursor:pointer; transition:background .15s}
.sw input::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(20px)}
.sub-cfg{display:grid; gap:6px; padding:8px 0 10px; border-bottom:1px solid var(--line)}
.ta{width:100%; min-height:96px; padding:10px; font:inherit; color:var(--fg); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; -webkit-appearance:none; appearance:none; resize:vertical}
.preset{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.roster-row{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0}
.rank-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.rank-actions .btn{flex:1 1 140px}
.fin-win{display:grid; gap:6px; justify-items:center; text-align:center; padding:4px 0}
.fin-win h2{margin:0}
.fin-win .av{width:64px; height:64px; font-size:28px}
.stand{display:grid}
.stand-row{--pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); display:grid; grid-template-columns:22px 28px minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line)}
.stand-row .av{width:28px; height:28px; font-size:13px}
.stand-row b{font-variant-numeric:tabular-nums}
.hl{padding:10px 12px; border-radius:10px; background:var(--surface-2); font-size:14px}
.hl em{display:block; font-style:normal; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.share-img{width:100%; border-radius:12px; display:block}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* Presentation mode */
.pres{position:fixed; inset:0; z-index:60; display:grid; grid-template-rows:auto minmax(0,1fr); gap:clamp(8px, 2vmin, 22px); background-color:var(--bg); color:var(--fg); font-family:var(--font-body);
  padding:max(12px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); overflow:hidden}
.pres[hidden]{display:none}
.pr-head{display:flex; align-items:center; justify-content:space-between; gap:clamp(10px, 2.4vmin, 28px); min-width:0}
.pr-title{font:700 clamp(18px, 4.4vmin, 48px)/1.1 var(--font-display); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pr-round{display:grid; justify-items:center; text-align:center; min-width:0}
.pr-round b{font:700 clamp(20px, 5.4vmin, 60px)/1.05 var(--font-display); color:#FF8A3D; white-space:nowrap}
.pr-round span{font-size:clamp(12px, 2.6vmin, 28px); color:#9AA7B4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:46vw}
.pr-meta{display:flex; align-items:center; justify-content:flex-end; gap:clamp(8px, 1.6vmin, 18px); font-size:clamp(12px, 2.6vmin, 28px); color:#9AA7B4; font-weight:600; flex-wrap:wrap; min-width:0}
.pr-meta .t-time{font-size:clamp(18px, 4.2vmin, 46px); color:#F2F5F8; cursor:pointer}
.pr-meta .t-time.over{color:#FF7A6B}
.pr-body{display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 6fr); gap:clamp(10px, 2.4vmin, 28px); min-height:0}
@media (orientation:portrait){ .pr-body{grid-template-columns:minmax(0, 1fr); grid-template-rows:minmax(0, 1.15fr) minmax(0, .85fr)} }
.pr-list{container-type:size; display:flex; flex-direction:column; gap:.4cqh; min-height:0}
.prow{--pc:hsl(var(--h,200) var(--ps,68%) var(--pl)); flex:1 1 0; min-height:0; display:grid; grid-template-columns:1.2em 1.9em minmax(0, 1fr) auto; align-items:center; gap:.45em; font-size:clamp(11px, min(calc(100cqh / var(--n) * .38), 6.4cqw), 46px); padding:0 .35em; border-radius:.5em; background:#171E26}
.prow.lead{box-shadow:inset 0 0 0 .1em #FF8A3D}
.prow .prk{color:#9AA7B4; font-weight:700; text-align:center; font-variant-numeric:tabular-nums}
.prow .av{width:1.8em; height:1.8em; font-size:.82em}
.prow .pmid{display:grid; gap:.18em; min-width:0}
.prow .pnm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.1}
.prow .pbar{position:relative; height:.3em; border-radius:.15em; background:#27313C}
.prow .pbar i{position:absolute; top:0; bottom:0; border-radius:.15em; background:var(--pc)}
.prow .pbar i.neg{background:#FF7A6B}
.prow .psc{font:700 1.2em/1 var(--font-display); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.prow .psc.negv{color:#FF7A6B}
.prow .psc small{display:inline-block; margin-left:.4em; padding:.1em .45em; border-radius:999px; background:#FF8A3D; color:#10151B; font:700 .5em/1.3 var(--font-display); vertical-align:middle}
.prow .psc small.negp{background:#FF7A6B}
.pr-chart{display:grid; grid-template-rows:auto minmax(0, 1fr); gap:.5em; min-height:0; padding:clamp(8px, 1.8vmin, 20px); border-radius:clamp(10px, 2vmin, 22px); background:#171E26}
.pr-ct{font:700 clamp(14px, 3vmin, 32px) var(--font-display)}
.pr-cb{position:relative; min-height:0; min-width:0}
.pr-cb svg{position:absolute; inset:0; width:100%; height:100%}
.pr-empty{display:grid; place-items:center; height:100%; text-align:center; color:#9AA7B4; font-size:clamp(14px, 3vmin, 30px); padding:0 8%}
.pr-fade{transition:opacity .3s}
.pr-fade.off{opacity:0; pointer-events:none}
.pr-meta .pill{background:rgba(255,255,255,.18); color:#F2F5F8}
.pr-hint{position:absolute; left:50%; transform:translateX(-50%); bottom:max(8px, env(safe-area-inset-bottom, 0px)); width:max-content; max-width:90vw; padding:5px 12px; border-radius:999px; background:#0E1318; border:1px solid #2A3440; text-align:center; font-size:12px; color:#C5CED8; display:none; pointer-events:none}
@media (orientation:portrait){ .pr-hint{display:block} }

.toast{position:fixed; left:50%; bottom:calc(var(--dock-h, 190px) + 14px); transform:translate(-50%, 12px); z-index:85; max-width:calc(100% - 32px); padding:10px 16px; border-radius:999px; background:var(--fg); color:var(--bg); font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s}
.toast.show{opacity:1; transform:translate(-50%, 0)}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:90}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

/* Game night look */
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes wig{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(7deg)}}
body{background-color:var(--bg); background-image:radial-gradient(var(--dot) 1.6px, transparent 1.9px); background-size:24px 24px; font-weight:600}
h1{font-size:30px; letter-spacing:0}
.sub{font-weight:600}
.icon-btn{border-radius:16px; border:2px solid var(--line); box-shadow:0 3px 0 var(--edge); transition:transform .08s, box-shadow .08s}
.icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--edge)}
.tabs, .seg{border-radius:18px; border:2px solid var(--line)}
.tabs button, .seg button{border-radius:13px; font-weight:800; transition:background .15s, color .15s, transform .08s}
.tabs button[aria-selected="true"], .seg button[aria-checked="true"]{background:var(--accent); color:var(--on-accent); box-shadow:0 3px 0 var(--accent-deep)}
.row{border-radius:18px; border:2px solid var(--line); box-shadow:0 3px 0 var(--edge)}
.row.sel{border-color:var(--accent)}
.row.lead{background:var(--gold); border-color:var(--gold-line)}
.track{height:12px; border-radius:7px}
.fill{border-radius:7px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.14), inset 0 2px 0 rgba(255,255,255,.3)}
.av{font-weight:700; box-shadow:0 0 0 2.5px var(--surface), 0 3px 0 2.5px var(--edge)}
.crown{transform-origin:50% 100%; animation:wig 2.6s ease-in-out infinite}
.btn{border-radius:16px; font-weight:800; box-shadow:0 4px 0 var(--accent-deep); transition:transform .08s, box-shadow .08s}
.btn.ghost{box-shadow:0 4px 0 var(--edge)}
.btn.danger{box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--edge)}
.btn:disabled{box-shadow:none}
.pill{font-weight:800; box-shadow:0 2px 0 var(--edge)}
.mini{border-radius:12px}
.game-row .mini{width:auto; min-width:52px; padding:0 12px; font-size:14px; font-weight:700}
.check-row{display:flex; align-items:center; gap:10px; min-height:44px; font-size:15px}
.check-row input{width:22px; height:22px; flex:none}
input[type="text"], input[type="number"], .turn-in, .ta{border-width:2px; border-radius:14px}
.chip{border-radius:16px; border-width:2px; background:var(--surface); box-shadow:0 3px 0 var(--edge); transition:transform .08s, box-shadow .08s}
.chip:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--edge)}
.chip.plus{border-color:var(--accent)}
.chip.minus{border-color:var(--neg)}
.dock{border-radius:28px 28px 0 0; border-top:2px solid var(--line); box-shadow:0 -10px 28px rgba(43,35,80,.16)}
.sheet{border-radius:28px 28px 0 0}
.sheet h2{font-size:23px}
.game-main, .hl, .dial{border-radius:16px}
.game-main{border-width:2px}
.strip, .chart-card{border-radius:20px; border:2px solid var(--line); box-shadow:0 3px 0 var(--edge)}
.st-main b{color:var(--accent-ink)}
.pod-block{border-radius:14px 14px 6px 6px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.16), inset 0 3px 0 rgba(255,255,255,.28)}
.note{border-radius:16px}
.toast{border-radius:999px}

/* Spinner wheel */
.wheel{background:radial-gradient(circle, var(--surface) 0 57%, var(--surface-2) 58%); box-shadow:0 4px 0 var(--edge), inset 0 0 0 3px var(--surface), inset 0 0 0 5px var(--line)}
.wheel-rot{background:repeating-conic-gradient(var(--accent) 0 1.6deg, transparent 1.6deg 15deg)}
.wheel-dot{box-shadow:0 0 0 3px var(--surface), 0 2px 5px rgba(0,0,0,.3)}
.wheel-hub{border:3px solid var(--line); box-shadow:0 4px 0 var(--edge)}

/* Felt table */
.table-felt{position:absolute; left:0; top:16px; width:var(--ts); height:var(--ts); border-radius:50%; background:radial-gradient(circle at 50% 36%, var(--felt-1), var(--felt-2) 78%); border:7px solid var(--wood); box-shadow:inset 0 0 40px rgba(0,0,0,.3), 0 5px 0 var(--wood-d), 0 14px 24px rgba(43,35,80,.2); pointer-events:none}
.table-ring{border:2px dashed rgba(255,255,255,.3)}
.table-mid{color:#FFF8E8}
.table-mid .t-name{color:#FFF8E8; font-weight:800; text-shadow:0 1px 0 rgba(0,0,0,.25)}
.table-mid .t-score{color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.25)}
.table-mid .t-score.negv{color:#FFD0D7}
.table-mid .t-hint{color:#E4F7EC; font-weight:700}
.table-mid .pend{display:inline-block; padding:1px 9px; border-radius:999px; background:var(--accent); color:var(--on-accent); text-shadow:none}
.table-mid .pend.negp{background:var(--neg); color:var(--on-neg)}
.seat .av{box-shadow:0 0 0 3px #fff, 0 3px 0 3px rgba(0,0,0,.25)}
.seat.sel .av{box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--accent), 0 4px 0 6px rgba(0,0,0,.25); animation:bob 1.6s ease-in-out infinite}
.seat.has-pend:not(.sel) .av{box-shadow:0 0 0 3px #fff, 0 0 0 5px #FFC93C}
.seat:active .av{transform:scale(.92)}
.seat-name{background:var(--surface); color:var(--fg); font-weight:800; font-size:10.5px; padding:0 6px; border-radius:8px; box-shadow:0 2px 0 var(--edge)}
.seat-score{background:var(--fg); color:var(--bg); padding:0 6px; border-radius:8px; box-shadow:0 2px 0 rgba(0,0,0,.25)}
.seat-score.negv{background:var(--neg); color:var(--on-neg)}
.table.m-dense .seat-score, .table.m-dense .seat-score.negv{background:none; box-shadow:none; padding:0; color:var(--pc-ink)}
.seat-pend{box-shadow:0 2px 0 rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){ .seat.sel .av, .crown{animation:none} }

/* Presentation mode */
.pr-round b, .pr-title{font-family:var(--font-display)}

/* Tournament */
.bracket{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 12px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch}
.t-col{flex:none; width:164px; display:flex; flex-direction:column; gap:8px; scroll-snap-align:start}
.t-col h3{margin:0; font:700 12px var(--font-display); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.t-matches{flex:1; display:flex; flex-direction:column; justify-content:space-around; gap:10px}
.t-match{border:2px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden}
.t-match.bye{opacity:.7}
.t-side{appearance:none; -webkit-appearance:none; width:100%; min-height:46px; display:flex; align-items:center; gap:8px; padding:6px 10px; border:0; background:none; color:var(--fg); font:inherit; font-weight:700; text-align:left; cursor:pointer}
.t-side + .t-side{border-top:1.5px solid var(--line)}
.t-side:disabled{cursor:default; color:var(--muted); font-weight:500}
.t-side.won{background:var(--gold); color:var(--fg)}
.t-side.lost{opacity:.5; text-decoration:line-through}
.t-dot{flex:none; width:14px; height:14px; border-radius:50%; background:hsl(var(--h,200) var(--ps,68%) var(--pl))}
.t-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.t-tick{flex:none; color:var(--accent-ink); font-weight:800}
.t-champ{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 14px; margin-bottom:8px; border-radius:16px; background:var(--gold); border:2px solid var(--gold-line); font-size:17px}
.t-champ .t-dot{width:18px; height:18px}
.tour{min-width:0; max-width:100%; display:grid; gap:10px}
.tour .bracket{max-width:100%; min-width:0}
.sheet{overflow-x:hidden}
.tour .btn{width:100%}
.rr-table{border:2px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden}
.rr-row{display:grid; grid-template-columns:22px minmax(0,1fr) 24px 24px 24px 24px 34px; gap:4px; align-items:center; padding:7px 10px; font-variant-numeric:tabular-nums; text-align:center; font-size:14px}

.rr-row.lead{background:var(--gold)}

.rr-rounds{display:grid; gap:12px}
.rr-round h3{margin:0 0 6px; font:700 12px var(--font-display); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}

.rr-match .t-side{padding:6px 8px}

.pr-round{justify-items:start; text-align:left}
@media (max-height:520px){
  .masthead{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); align-items:center; gap:12px; padding-block:8px 6px}
  .masthead .sub{display:none}
  h1{font-size:22px}
  .tabs button{height:34px}
}
.prow .pmid{gap:.36em}
.prow .pnm{line-height:1.15; padding-top:.05em}
.prow .pbar{height:.32em; border-radius:.16em}
.prow .pbar i{border-radius:.16em}
.seat{gap:2px}
.seat-name{margin-top:1px}
/* Landscape phones: scoring panel becomes a side card so the boards keep their height */
@media (orientation:landscape) and (max-height:520px){
  :root{--dock-w:max(290px, min(42vw, 360px))}
  main{padding-bottom:16px; padding-right:calc(var(--dock-w) + 8px)}
  body[data-tab="rank"] main{padding-bottom:16px}
  .table{--ts:min(calc(100vw - var(--dock-w) - 56px), 380px, max(190px, calc(100svh - var(--mast-b, 58px) - 74px)))}
  .dock, body.is-pres .dock{left:auto; top:auto; right:0; bottom:0; width:var(--dock-w); max-height:calc(100svh - var(--mast-b, 58px) - 6px); overflow-y:auto; display:block; border-radius:20px 0 0 0; border-left:1.5px solid var(--line); padding-left:14px; padding-right:max(14px, env(safe-area-inset-right, 0px)); padding-top:10px}
  body[data-tab="rank"] .dock{display:none}
  body.is-pres .dock{display:block}
  body.is-pres .pres{right:var(--dock-w); padding-bottom:max(10px, env(safe-area-inset-bottom, 0px)); padding-right:10px}
  body.is-pres .pr-hint{display:none}
  body.is-pres:not(.has-sel) .pres{right:0; padding-right:max(18px, env(safe-area-inset-right, 0px))}
  body.is-pres.dock-bar:not(.has-sel) .pres{padding-bottom:0}
  body.is-pres .pr-actions{justify-content:flex-start}
  body.is-pres.dock-bar:not(.has-sel) .pr-actions{padding-bottom:max(4px, env(safe-area-inset-bottom, 0px))}
  .wheel{width:min(var(--wheel-size, 190px), calc(100svh - var(--mast-b, 58px) - 200px)); height:min(var(--wheel-size, 190px), calc(100svh - var(--mast-b, 58px) - 200px)); min-width:120px; min-height:120px}
  .wheel-box{gap:10px}
  .dock .dock-who .meta{display:none}
  .dock .round-bar .btn{white-space:normal; line-height:1.15; padding:0 10px; font-size:14px}
  .dock{overflow-x:hidden}
  .toast{bottom:16px}
  .pres .pr-list{min-height:0}
  .dock.slim, body.is-pres .dock.slim{width:auto; max-width:var(--dock-w); background:transparent; border:0; box-shadow:none; padding:8px 14px; pointer-events:none}
  .dock.slim .btn{pointer-events:auto}
  .dock.slim .dock-head{display:none}
  .dock.slim .dock-who{display:none}
  .dock.slim.idle, body.is-pres .dock.slim.idle{display:none}
}
/* Look picker */
.skin-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.skin-opt{appearance:none; -webkit-appearance:none; display:grid; gap:6px; justify-items:start; text-align:left; padding:10px 12px; border:2px solid var(--line); border-radius:14px; background:var(--bg); color:var(--fg); font:inherit; font-weight:700; cursor:pointer}
.skin-opt[aria-checked="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset}
.skin-sw{display:flex}
.skin-sw i{width:22px; height:22px; border-radius:50%; border:2px solid var(--surface); margin-right:-6px}

<body>

<header class="masthead">
  <div class="mast-row">
    <div class="mast-title">
      <h1 id="title">Round Tally</h1>
      <p class="sub" id="count"></p>
    </div>
    <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabScore" type="button" aria-selected="true">Score</button>
    <button role="tab" id="tabRank" type="button" aria-selected="false">Ranking</button>
  </div>
</header>

<main>
  <div id="note"></div>
  <div class="rows" id="rows"></div>
  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="addIn" maxlength="200" placeholder="Add players, separated by commas" aria-label="Add players">
    <button class="btn" id="addBtn" type="submit">Add</button>
  </form>
  <div class="roster-row" id="rosterRow"></div>
  <p class="msg" id="addMsg" aria-live="polite"></p>
</main>

<section class="dock" id="dock" aria-label="Scoring"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="pres" id="pres" role="dialog" aria-label="Presentation mode" hidden></div>

<div class="overlay" id="overlay" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></section>
</div>

<script>

  function loadGame(g){
    if (!g){ state.game = ""; state.gdef = null; save(); render(); return; }

    state.lowWins = g.low; state.target = g.target; state.targetHit = false;

    state.feat.rounds = true; if (g.target) state.feat.target = true;
    if (/^(Game night|New game)/.test(state.title)) state.title = g.name;
    save(); render();
  }
  function openGameEditor(g0){
    var isNew = !g0 || !g0.id || !(userLib[g0.id] || BUILTIN[g0.id]);

    var f = function(id, label, node){ return h("label", {class: "field", for: id}, h("span", {}, label), node); };
    var nameIn = h("input", {type: "text", id: "gName", maxlength: 30, value: g.name, autocomplete: "off"});
    var unitIn = h("input", {type: "text", id: "gUnit", maxlength: 12, value: g.unit, autocomplete: "off", placeholder: "Round, Hole, Hand…"});
    var totIn = h("input", {type: "number", inputmode: "numeric", min: "0", max: "60", id: "gTot", value: String(g.total)});
    var tgtIn = h("input", {type: "number", inputmode: "numeric", min: "0", id: "gTgt", value: String(g.target)});
    var noteIn = h("input", {type: "text", id: "gNote", maxlength: 30, value: g.note, autocomplete: "off", placeholder: "Shown in the middle, e.g. First to 100"});
    var planIn = h("textarea", {class: "ta", id: "gPlan", maxlength: 1500, placeholder: "One per line, for example:\n2 sets of 3\n1 set + 1 run of 4"}); planIn.value = g.plan.join("\n");

    function drawSeg(){ seg.replaceChildren.apply(seg, [["High score wins", false], ["Low score wins", true]].map(function(o){

        plan: planIn.value.split("\n")}, g.id);

    function commit(load){
      var d = read(), isB = !!BUILTIN[g.id];

        d.id = "c" + uid(); d.blurb = "";
      } else d.id = g.id;

    if (!isNew && !BUILTIN[g.id]) extra.push(confirmBtn("Delete this game", "Tap again to delete", function(){ delete userLib[g.id]; saveUserLib(); closeSheet(); openSettings("game"); }));

  function openEdit(id){

  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var t = setTimeout(function(){ reject(new Error("timeout")); }, ms);

    });

  function localLoad(){
    try {
      var raw = localStorage.getItem(LIB_KEY);
      if (raw){
        var o = JSON.parse(raw), out = {cur: o && o.cur, games: {}, roster: normRoster(o && o.roster)};
        if (o && o.games) Object.keys(o.games).forEach(function(id){ var g = normalize(o.games[id]); if (g) out.games[id] = g; });
        return out;
      }
      var old = localStorage.getItem(LS_KEY);

        var g1 = normalize(JSON.parse(old));
        if (g1){ var id1 = uid(), games = {}; g1.updated = Date.now(); games[id1] = g1; return {cur: id1, games: games, roster: {}}; }
      }

  async function init(){
    applySkin(getSkin()); applyWheelSize();
    document.body.classList.add("loading");

        if (db && uidv){
          var col = db.collection("data/users/" + uidv);
          var qs = await withTimeout(col.get(), 8000);
          qs.docs.forEach(function(d){
            var k = d.id, v = d.data();
            if (!v) return;
            if (k.slice(0, 2) === "g-"){ var g = normalize(v); if (g) lib.games[k.slice(2)] = g; }

    var ids = gameIds();
